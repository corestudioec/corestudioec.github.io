document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-if>\n<button sc-camel-on-click=\"{{ salir }}\" style=\"height:40px;font-size:12px;letter-spacing:.12em;font-weight:500;background:transparent;color:#F6F0EA;border:1px solid #A99F8A;padding:0 16px;border-radius:999px;white-space:nowrap\">SALIR<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fheader>\n<sc-if value=\"{{ demo }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#F1EAE1;text-align:center;padding:7px 12px;font-size:11px;letter-spacing:.16em;font-weight:600;color:#4A423B\">MODO DEMO · DATOS DE PRUEBA<\u002Fdiv><\u002Fsc-if>\n\n<main style=\"max-width:520px;margin:0 auto;padding:20px 16px 72px;display:flex;flex-direction:column;gap:18px\">\n\n<sc-if value=\"{{ boot }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin:0;font-size:16px;color:#4A423B\">Cargando…<\u002Fp><\u002Fsc-if>\n\n<sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ false }}\">\n<form sc-camel-on-submit=\"{{ entrar }}\" style=\"display:flex;flex-direction:column;gap:14px;padding-top:8px\">\n<h1 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:48px;line-height:.95\">Entrar al <em>panel<\u002Fem><\u002Fh1>\n<p style=\"margin:0;font-size:15px;color:#4A423B\">Usa el correo y la contraseña que te dio la administradora.<\u002Fp>\n<input type=\"email\" autocomplete=\"username\" value=\"{{ email }}\" sc-camel-on-input=\"{{ onEmail }}\" placeholder=\"Correo\" aria-label=\"Correo\" style=\"font-size:17px;padding:15px 16px;border:1px solid #C9C0B1;border-radius:12px;background:#FFFDFB;color:#2A2521;outline:none\">\n<input type=\"password\" autocomplete=\"current-password\" value=\"{{ pass }}\" sc-camel-on-input=\"{{ onPass }}\" placeholder=\"Contraseña\" aria-label=\"Contraseña\" style=\"font-size:17px;padding:15px 16px;border:1px solid #C9C0B1;border-radius:12px;background:#FFFDFB;color:#2A2521;outline:none\">\n<sc-if value=\"{{ hasLoginErr }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:15px;color:#9A3B2E\">{{ loginErr }}<\u002Fp><\u002Fsc-if>\n<button type=\"submit\" disabled=\"{{ busy }}\" style=\"border:0;background:#2A2521;color:#F6F0EA;padding:18px;border-radius:12px;font-size:17px;font-weight:500\" style-hover=\"background:#4A423B\">Entrar<\u002Fbutton>\n<\u002Fform>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ noStaff }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<h1 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:40px;line-height:1\">Usuario sin acceso<\u002Fh1>\n<p style=\"margin:0;font-size:15px;line-height:1.5;color:#4A423B\">Tu correo entró bien, pero todavía no está habilitado en el panel. Pide a la administradora que te agregue.<\u002Fp>\n<button sc-camel-on-click=\"{{ salir }}\" style=\"align-self:flex-start;border:1.5px solid #2A2521;background:transparent;color:#2A2521;padding:12px 24px;border-radius:999px;font-size:13px;letter-spacing:.12em;font-weight:600\">SALIR<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ scan }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<span style=\"font-size:12px;letter-spacing:.18em;font-weight:500;color:#4A423B\">{{ scanTitulo }}<\u002Fspan>\n<div style=\"position:relative;border-radius:24px;overflow:hidden;background:#2A2521;aspect-ratio:1 / 1\">\n<video ref=\"{{ setVideo }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fvideo>\n<div style=\"position:absolute;inset:16%;border:2px solid #D8C7A6;border-radius:20px;pointer-events:none\"><\u002Fdiv>\n<span style=\"position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:14px;letter-spacing:.1em;color:#F6F0EA\">APUNTA AL QR DE LA ALUMNA<\u002Fspan>\n<button sc-camel-on-click=\"{{ cerrarScanner }}\" style=\"position:absolute;top:12px;right:12px;font-size:12px;letter-spacing:.12em;font-weight:600;background:#FBF7F3;color:#2A2521;border:0;padding:8px 14px;border-radius:999px\">CERRAR<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ hasScanErr }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:15px;color:#9A3B2E\">{{ scanErr }}<\u002Fp><\u002Fsc-if>\n\n<sc-if value=\"{{ vHome }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<button sc-camel-on-click=\"{{ scanAsistencia }}\" style=\"display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:#2A2521;color:#F6F0EA;border:0;padding:28px 24px;border-radius:24px\" style-hover=\"background:#4A423B\">\n<span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:40px;line-height:.95\">Marcar asistencia<\u002Fspan>\n<span style=\"font-size:15px;color:#E2DACF\">Escanea el QR y suma +1 ★ al instante<\u002Fspan>\n<\u002Fbutton>\n<button sc-camel-on-click=\"{{ irClases }}\" style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:#F1EAE1;color:#2A2521;border:1px solid #D8CDBC;padding:20px 22px;border-radius:20px\" style-hover=\"background:#E8E1D6\"><span style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:19px;font-weight:500\">Clases y reservas<\u002Fspan><span style=\"font-size:14px;color:#6E655C\">Quién reservó, cuidados y recordatorios<\u002Fspan><\u002Fspan><span style=\"font-size:22px\">→<\u002Fspan><\u002Fbutton>\n<button sc-camel-on-click=\"{{ irAlumnas }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:#FFFDFB;color:#2A2521;border:1px solid #A99F8A;padding:20px 22px;border-radius:20px\" style-hover=\"background:#F1EAE1\"><span style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:19px;font-weight:500\">Alumnas · Fichas 360<\u002Fspan><span style=\"font-size:14px;color:#6E655C\">Todas las alumnas, asistencia, alertas y progreso<\u002Fspan><\u002Fspan><span style=\"font-size:22px\">→<\u002Fspan> t;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conexión&quot;}}\">\nclass Component extends DCLogic {\n  state = { boot: true, yo: null, noStaff: false, demoAuto: false, view: 'home', email: '', pass: '', loginErr: '', busy: false,\n    q: '', resultados: null, buscarErr: '', scan: false, scanModo: 'ficha', scanErr: '',\n    ficha: null, err: '', toast: '', subio: null, merch: false, monto: '', check: null,\n    nNombre: '', nTel: '', nPlan: '', creada: null, hoy: null, prog: null, clasesHoy: null, diaOff: 0, rutF: null, rfSel: 0, rEdit: null, rResp: '', plantillas: null, plEdit: null, plAsig: null, alumnas: null, alQ: '', alFiltro: 'todas', alOrden: 'az', editPerfil: false, pObj: [], pLes: '', nota: '' };\n\n  get sbUrl() { return String(this.props.supabaseUrl || 'https://jukpaqtriemqvxormrgb.supabase.co').replace(/\\/+$/, ''); }\n  get sbKey() { return String(this.props.supabaseKey || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1a3BhcXRyaWVtcXZ4b3JtcmdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzODY1ODQsImV4cCI6MjEwNTk2MjU4NH0.4PPIVK2HvvgwrGEtNVn7CozqDCldvlFWnK2rpgrOmHE'); }\n  get demo() { return !!this.props.demo || /[?&]demo=1/.test(location.search) || this.state.demoAuto; }\n\n  _instalable() {\n    try {\n      const h = document.head, add = (tag, attrs) => { const sel = tag + Object.keys(attrs).filter(k => k === 'rel' || k === 'name').map(k => '[' + k + '=\"' + attrs[k] + '\"]').join(''); let el = h.querySelector(sel); if (!el) { el = document.createElement(tag); h.appendChild(el); } Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k])); };\n      add('link', { rel: 'manifest', href: 'corepanel.webmanifest' });\n      add('link', { rel: 'apple-touch-icon', href: 'corepanel-180.png' });\n      add('link', { rel: 'icon', href: 'corepanel-192.png', type: 'image/png' });\n      add('meta', { name: 'apple-mobile-web-app-title', content: 'Core Panel' });\n      add('meta', { name: 'application-name', content: 'Core Panel' });\n      add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });\n      add('meta', { name: 'mobile-web-app-capable', content: 'yes' });\n      add('meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'black-translucent' });\n      document.title = 'Core Panel';\n    } catch (e) {}\n  }\n\n  componentDidMount() {\n    this._instalable();\n    let n = 0;\n    const esperar = () => {\n      if (window.supabase && window.supabase.createClient) return this._init();\n      if (++n > 120) return this.setState({ boot: false, loginErr: 'No cargó la conexión. Revisa internet y recarga.' });\n      setTimeout(esperar, 100);\n    };\n    esperar();\n  }\n  componentWillUnmount() { this._gone = true; this._stopScan(); if (this._authSub) this._authSub.unsubscribe(); }\n\n  async _init() {\n    this.sb = window.supabase.createClient(this.sbUrl, this.sbKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'cs-panel-auth' } });\n    if (!this.demo) {\n      const { error } = await this.sb.rpc('cs_ping');\n      if (error && (error.code === 'PGRST202' || /Could not find the function/i.test(error.message || ''))) this.setState({ demoAuto: true });\n    }\n    if (this.demo) return this._entrar();\n    const { data } = await this.sb.auth.getSession();\n    if (data && data.session) this._entrar(); else this.setState({ boot: false });\n    const sub = this.sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') this.setState({ yo: null, boot: false }); });\n    this._authSub = sub && sub.data && sub.data.subscription;\n  }\n\n  async _entrar() {\n    try {\n      const yo = await this._rpc('cs_yo');\n      if (!yo) return this.setState({ boot: false, noStaff: true });\n      this.setState({ boot: false, yo, noStaff: false, loginErr: '' });\n    } catch (e) { this.setState({ boot: false, loginErr: e.message }); }\n  }\n\n  async _rpc(fn, args) {\n    if (this.demo) return this._mock(fn, args || {});\n    const { data, error } = await this.sb.rpc(fn, args || {});\n    if (error) {\n      const m = error.message || '';\n      if (/JWT|session/i.test(m)) throw new Error('Tu sesión expiró. Sal y vuelve a entrar.');\n      if (/fetch|NetworkError|Load failed/i.test(m)) throw new Error('Sin conexión. Revisa el internet.');\n      if (/No autorizado/i.test(m)) throw new Error('Tu usuario no tiene acceso al panel.');\n      throw new Error(m);\n    }\n    return data;\n  }\n\n  _go(view, extra) { this._stopScan(); this.setState(Object.assign({ view, err: '', scanErr: '' }, extra || {})); try { window.scrollTo(0, 0); } catch (e) {} }\n\n  entrar = async (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    const email = this.state.email.trim(), password = this.state.pass;\n    if (!email || !password) return this.setState({ loginErr: 'Escribe correo y contraseña.' });\n    this.setState({ busy: true, loginErr: '' });\n    const { error } = await this.sb.auth.signInWithPassword({ email, password });\n    this.setState({ busy: false, pass: '' });\n    if (error) return this.setState({ loginErr: /fetch/i.test(error.message) ? 'Sin conexión.' : 'Correo o contraseña incorrectos.' });\n    this._entrar();\n  };\n\n  salir = async () => {\n    this._stopScan();\n    if (this.demo) return;\n    try { await this.sb.auth.signOut(); } catch (e) {}\n    this.setState({ yo: null, noStaff: false, ficha: null, view: 'home', boot: false });\n  };\n\n  buscar = async (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    const q = this.state.q.trim();\n    if (q.length < 3) return this.setState({ buscarErr: 'Escribe al menos 3 letras o números.' });\n    this.setState({ busy: true, buscarErr: '', resultados: null });\n    try {\n      const r = (await this._rpc('cs_buscar', { p_q: q })) || [];\n      if (r.length === 1) await this._abrir(r[0].token);\n      else this.setState({ resultados: r, buscarErr: r.length ? '' : 'No encontramos a nadie. Si es nueva, regístrala abajo.' });\n    } catch (err) { this.setState({ buscarErr: err.message }); }\n    this.setState({ busy: false });\n  };\n\n  async _abrir(ref) {\n    const f = await this._rpc('cs_ficha', { p_ref: String(ref) });\n    this._go('ficha', { ficha: f, resultados: null, q: '', toast: '', subio: null, merch: false, monto: '', prog: null, editPerfil: false, nota: '', rutF: null, rfSel: 0, rEdit: null, rResp: '' });\n    this._loadProg(f.token);\n    this._loadRut(f.token);\n  }\n  async _loadRut(token) {\n    try { const r = await this._rpc('cs_rutinas_alumna', { p_token: token }); if (this.state.ficha && this.state.ficha.token === token) this.setState({ rutF: r || [] }); }\n    catch (e) { this.setState({ rutF: [] }); }\n  }\n  _lunes(off) { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + off * 7); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }\n  async _rutAccion(fn, args, extra) {\n    this.setState({ busy: true, err: '' });\n    try { const r = await this._rpc(fn, args); this.setState(Object.assign({ rutF: r }, extra || {})); return true; }\n    catch (e) { this.setState({ err: e.message }); return false; }\n    finally { this.setState({ busy: false }); }\n  }\n  async _loadPl() { try { this.setState({ plantillas: await this._rpc('cs_plantillas') }); } catch (e) { this.setState({ plantillas: [], err: /cs_plantillas|function/i.test(e.message) ? 'Falta ejecutar 04_rutinas.sql en Supabase.' : e.message }); } }\n  irAlumnas = async () => {\n    this._go('alumnas', { alumnas: null });\n    try { this.setState({ alumnas: await this._rpc('cs_alumnas') }); }\n    catch (e) { this.setState({ alumnas: [], err: /cs_alumnas|function/i.test(e.message) ? 'Falta ejecutar 05_alumnas.sql en Supabase.' : e.message }); }\n  };\n  irPlantillas = async () => { this._go('plantillas', { plEdit: null, plAsig: null, toast: '' }); await this._loadPl(); };\n  async _guardarPl() {\n    const e = this.state.plEdit; if (!e) return;\n    this.setState({ busy: true, err: '' });\n    try { const pl = await this._rpc('cs_plantilla_guardar', { p_id: e.id || null, p_nombre: e.nombre, p_descripcion: e.descripcion || '', p_bloques: e.bloques.filter(b => (b.nombre || '').trim() || (b.texto || '').trim()) }); this.setState({ plantillas: pl, plEdit: null, toast: 'Plantilla guardada' }); }\n    catch (er) { this.setState({ err: er.message }); }\n    this.setState({ busy: false });\n  }\n  async _borrarPl() {\n    const e = this.state.plEdit; if (!e || !e.id || !window.confirm('¿Eliminar “' + e.nombre + '”? Las rutinas ya asignadas no se borran.')) return;\n    this.setState({ busy: true, err: '' });\n    try { this.setState({ plantillas: await this._rpc('cs_plantilla_borrar', { p_id: e.id }), plEdit: null, toast: 'Plantilla eliminada' }); } catch (er) { this.setState({ err: er.message }); }\n    this.setState({ busy: false });\n  }\n  async _buscarAsig(ev) {\n    if (ev && ev.preventDefault) ev.preventDefault();\n    const A = this.state.plAsig; if (!A || A.q.trim().length < 2) return;\n    this.setState({ busy: true, err: '' });\n    try { const r = (await this._rpc('cs_buscar', { p_q: A.q.trim() })) || []; this.setState({ plAsig: Object.assign({}, this.state.plAsig, { res: r }) }); } catch (e) { this.setState({ err: e.message }); }\n    this.setState({ busy: false });\n  }\n  async _asignarVarias() {\n    const A = this.state.plAsig; const tk = Object.keys(A.sel); if (!tk.length) return;\n    this.setState({ busy: true, err: '' });\n    try { const n = await this._rpc('cs_rutina_asignar_varias', { p_plantilla: A.pl.id, p_tokens: tk, p_semana: this._lunes(A.semOff) }); this.setState({ plAsig: null, toast: 'Rutina asignada a ' + n + (n === 1 ? ' alumna' : ' alumnas') + '.' }); }\n    catch (e) { this.setState({ err: e.message }); }\n    this.setState({ busy: false });\n  }\n  async _loadProg(token) {\n    try { const p = await this._rpc('cs_progreso', { p_token: token }); if (this.state.ficha && this.state.ficha.token === token) this.setState({ prog: p }); }\n    catch (e) { this.setState({ err: e.message }); }\n  }\n  _diaKey(off) { const d = new Date(); d.setDate(d.getDate() + off); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }\n  async _loadClases(off) {\n    try {\n      let r;\n      try { r = await this._rpc('cs_clases_dia', { p_dia: this._diaKey(off) }); }\n      catch (e) { if (off === 0 && /cs_clases_dia|function/i.test(e.message)) r = await this._rpc('cs_clases_hoy'); else throw e; }\n      if (this.state.diaOff === off) this.setState({ clasesHoy: r });\n    } catch (e) { this.setState({ err: e.message, clasesHoy: [] }); }\n  }\n  irClases = async () => {\n    const off = this.state.view === 'clases' ? this.state.diaOff : 0;\n    this._go('clases', { clasesHoy: null, toast: '', diaOff: off });\n    await this._loadClases(off);\n  };\n  async _marcarLista(a) {\n    this.setState({ busy: true, err: '', toast: '' });\n    try {\n      const r = await this._rpc('cs_sumar', { p_token: a.token, p_actividad: 'clase' });\n      this.setState({ toast: String(a.nombre).split(' ')[0] + ' · asistencia marcada +' + r.sumadas + ' ★' });\n      await this._loadClases(this.state.diaOff);\n    } catch (e) { this.setState({ err: e.message }); }\n    this.setState({ busy: false });\n  }\n  async _guardarPerfil() {\n    const f = this.state.ficha; if (!f) return;\n    this.setState({ busy: true, err: '' });\n    try { const p = await this._rpc('cs_perfil', { p_token: f.token, p_objetivo: this.state.pObj.join(', '), p_lesiones: this.state.pLes }); this.setState({ prog: p, editPerfil: false }); }\n    catch (e) { this.setState({ err: e.message }); }\n    this.setState({ busy: false });\n  }\n  async _agregarNota() {\n    const f = this.state.ficha, t = this.state.nota.trim(); if (!f || !t) return;\n    this.setState({ busy: true, err: '' });\n    try { const p = await this._rpc('cs_not
